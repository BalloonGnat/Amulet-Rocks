name: Unittests

on:
  push:
    branches:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['11', '12', '13']
        cfg:
          - { os: ubuntu-24.04-arm, architecture: arm64, whl: 'manylinux_aarch64' }

    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
    - name: Clone
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.${{ matrix.python-version }}'
        architecture: ${{ matrix.cfg.architecture }}

    - name: Build and Test
      run: |
        pip install cibuildwheel~=4.1
        cibuildwheel --only cp3${{ matrix.python-version }}-${{ matrix.cfg.whl }} --output-dir dist .

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: cp3${{ matrix.python-version }}-${{ matrix.cfg.whl }}
        path: dist/*
