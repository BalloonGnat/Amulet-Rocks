name: Build ARM64 Wheels

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version to build"
        required: true
        default: "3.13"
        type: choice
        options:
          - "3.11"
          - "3.12"
          - "3.13"

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          architecture: arm64

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build cibuildwheel~=4.1

      - name: Build sdist
        run: |
          python -m build --sdist --outdir dist .

      - name: Build aarch64 wheel
        env:
          CIBW_TEST_COMMAND: ""
        run: |
          cibuildwheel --platform linux --archs aarch64 --output-dir dist .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amulet-rocksdb-aarch64-${{ inputs.python-version }}
          path: dist/*
          if-no-files-found: error
