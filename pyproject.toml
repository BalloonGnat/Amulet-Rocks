[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "packaging",
    "versioneer",
]
build-backend = "setuptools.build_meta"

[project]
name = "amulet-rocksdb"
version = "1.0.6"
description = "A pybind11 wrapper for Facebook's RocksDB."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "James Clare" },
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "setuptools>=68",
    "types-setuptools",
    "versioneer",
    "types-versioneer",
    "packaging",
    "pybind11_stubgen>=2.5.4",
    "black>=22.3",
    "isort",
    "autoflake",
    "mypy",
    "types-pyinstaller",
]

[project.urls]
Homepage = "https://www.amuletmc.com"
Repository = "https://github.com/Amulet-Team/Amulet-RocksDB"
Issues = "https://github.com/Amulet-Team/Amulet-RocksDB/issues"

[project.entry-points.pyinstaller40]
hook-dirs = "rocksdb.__pyinstaller:get_hook_dirs"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = [
    "**/*.dll",
    "**/*.so",
    "**/*.dylib",
    "**/*.lib",
]

[tool.cibuildwheel]
test-sources = ["tests"]
test-command = "python -m unittest discover -s tests"
skip = ["*-musllinux_*"]

[tool.cibuildwheel.macos]
repair-wheel-command = """
export MACOSX_DEPLOYMENT_TARGET=11.0
delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
"""

[tool.cibuildwheel.linux]
before-all = "yum install -y cmake"

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair --ignore-existing --exclude msvcp140.dll -w {dest_dir} -v {wheel}"
